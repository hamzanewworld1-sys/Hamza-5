<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تم الاختراق 😂</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.box{width:min(92%,700px);text-align:center;padding:45px 25px;border:2px solid #f23;border-radius:18px;background:#160005;box-shadow:0 0 35px #f233}.warn{font-size:90px;animation:pulse 1s infinite alternate}h1{font-size:clamp(40px,9vw,75px);margin:10px 0;color:#ff1744;text-shadow:0 0 18px #f23}p{font-size:20px}small{color:#777}button{margin-top:20px;padding:12px 24px;border:0;border-radius:10px;background:#ff1744;color:#fff;font-size:17px;cursor:pointer}@keyframes pulse{to{transform:scale(1.08);opacity:.7}}</style>
</head>
<body><div class="box"><div class="warn">⚠️</div><h1>تم الاختراق 😂</h1><p>جهازك الآن تحت السيطرة...</p><small>مزحة فقط 😎 لا يوجد اختراق أو جمع للبيانات.</small><br><button onclick="alert('انمسكت بالمقلب 😂')">اضغط هنا</button></div></body>
</html>
